temperbridge_nova:
  head_pulse:
  legs_pulse:
  head:
  legs:
  head_raise:
  head_lower:
  legs_raise:
  legs_lower:

button:
  - platform: template
    name: Flat
    icon: mdi:minus
    on_press:
      - temperbridge_nova.send_key:
          id: ${temperbridge_nova_id}
          key_code: "08000000"

  - platform: template
    name: Zero G
    icon: mdi:angle-acute
